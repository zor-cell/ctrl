spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/${DB_NAME}

garage:
  url: http://localhost:3900
  public-url: http://${GARAGE_BUCKET_NAME:ctrl-dev-media}.web.garage.localhost:3902
  access-key: ${GARAGE_ACCESS_KEY}
  secret-key: ${GARAGE_SECRET_KEY}
  bucket-name: ${GARAGE_BUCKET_NAME:ctrl-dev-media}

application:
  security:
    id-austria:
      issuer-uri: "http://localhost:8081/realms/id-austria-mock"
      token-uri: "http://localhost:8081/realms/id-austria-mock/protocol/openid-connect/token"
      redirect-uri: "http://localhost:4200/verification-callback"
  auth:
    require-email-verification: false

infinity:
  url: http://localhost:7997
