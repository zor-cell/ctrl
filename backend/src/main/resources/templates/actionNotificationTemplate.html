<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTRL Verification</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d10;
            background-image: linear-gradient(160deg, #0d0d10 0%, #12102a 55%, #0a1a1a 100%);
            font-family: "DM Sans", "Segoe UI", Arial, sans-serif;
            color: #f0f0f5;
        }

        .wrapper {
            width: 100%;
            padding: 40px 16px;
            box-sizing: border-box;
        }

        .card {
            max-width: 560px;
            margin: 0 auto;
            background: linear-gradient(135deg, #16161c, #1e1e27);
            border: 1px solid #2a2a38;
            border-radius: 18px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
            overflow: hidden;
        }

        .content {
            padding: 36px 32px;
        }

        .logo {
            margin: 0 0 18px;
            font-family: "Syne", "Segoe UI", Arial, sans-serif;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #7c6ffc;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 10px;
            font-family: "Syne", "Segoe UI", Arial, sans-serif;
            font-size: 30px;
            line-height: 1.2;
            color: #f0f0f5;
        }

        p {
            margin: 0;
            font-size: 16px;
            line-height: 1.6;
            color: #f0f0f5;
        }

        .subtitle {
            margin-bottom: 26px;
        }

        .subtitle span {
            color: #4ecdc4;
            font-weight: 600;
        }

        .code-card {
            margin-top: 18px;
            padding: 20px;
            border-radius: 14px;
            border: 1px solid rgba(124, 111, 252, 0.35);
            background: rgba(124, 111, 252, 0.12);
        }

        .code-label {
            margin: 0 0 14px;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #a7a7c2;
        }

        .code {
            margin: 0;
            font-family: "Syne", "Courier New", monospace;
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 8px;
            color: #f0f0f5;
            text-align: center;
        }

        .action-wrap {
            margin-top: 22px;
            text-align: center;
        }

        .email-button a {
            display: inline-block;
            min-width: 220px;
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #3f3f46;
            background-color: #18181b;
            color: #fafafa;
            font-family: "DM Sans", "Segoe UI", Arial, sans-serif;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.2;
            text-decoration: none;
            letter-spacing: 0.2px;
            box-sizing: border-box;
        }

        .email-button a:hover {
            background-color: #27272a;
            border-color: #52525b;
        }

        .email-button a:active {
            background-color: #3f3f46;
        }

        .fallback {
            margin-top: 14px;
            font-size: 13px;
            color: #a7a7c2;
            text-align: center;
        }

        .footer {
            margin-top: 22px;
            font-size: 12px;
            color: #6b6b82;
            text-align: center;
        }

        @media (max-width: 640px) {
            .content {
                padding: 28px 20px;
            }

            h1 {
                font-size: 26px;
            }

            .code {
                font-size: 28px;
                letter-spacing: 6px;
            }
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="card">
        <div class="content">
            <p class="logo">CTRL</p>
            <h1>An action has been taken against your content!</h1>
            <p class="subtitle">We have received a report against your content.</p>
            <p style="color: #f0f0f5;">After careful review, we regret to inform you that your
                <span th:if="${type == 'ACCOUNT'}">account has been suspended.</span>
                <span th:if="${type == 'SOURCE'}">source has been removed.</span>
                <span th:if="${type == 'POST'}">post has been removed.</span>
                <span th:if="${type == 'COMMENT'}">comment has been removed.</span></p>
        </div>
    </div>
</div>
</body>
</html>
