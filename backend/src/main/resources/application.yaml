spring:
  application:
    name: ctrl
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    url: jdbc:postgresql://db:5432/${DB_NAME}
    username: ${db_username}
    password: ${db_password}
    driver-class-name: org.postgresql.Driver

management:
  endpoints:
    web:
      exposure:
        include:
          health
  endpoint:
    health:
      show-details:
        always
