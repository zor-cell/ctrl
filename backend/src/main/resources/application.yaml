spring:
  application:
    name: ctrl
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    url: jdbc:postgresql://db:5432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        debug: true

garage:
  url: http://garage:3900
  public-url: http://${GARAGE_BUCKET_NAME:ctrl-dev-media}.web.garage.localhost:3902
  access-key: ${GARAGE_ACCESS_KEY}
  secret-key: ${GARAGE_SECRET_KEY}
  bucket-name: ctrl-prod-media

infinity:
  url: http://infinity:7997
  model: ${INFINITY_MODEL}

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: 86400000 #1 day in ms
    id-austria:
      issuer-uri: "http://keycloak:8080/realms/id-austria-mock"
      client-id: "http://localhost:8080"
      client-secret: ${ID_AUSTRIA_SECRET}
      token-uri: "http://keycloak:8080/realms/id-austria-mock/protocol/openid-connect/token"
      redirect-uri: "http://localhost:80/verification-callback"
  auth:
    require-email-verification: ${MAIL_REQUIRED}

management:
  endpoints:
    web:
      exposure:
        include:
          health
  endpoint:
    health:
      show-details:
        always

logging:
  level:
    org.springframework.mail: DEBUG
    org.eclipse.angus.mail: DEBUG
    jakarta.mail: DEBUG