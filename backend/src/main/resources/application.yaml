spring:
  application:
    name: ctrl
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    url: jdbc:postgresql://db:5432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update

minio:
  url: http://minio:9000
  access-key: ${MINIO_USER}
  secret-key: ${MINIO_PASSWORD}
  bucket-name: ctrl-prod-media

infinity:
  url: http://infinity:7997
  model: ${INFINITY_MODEL}
  dimensions: ${INFINITY_MODEL_DIMENSIONS}

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: 86400000 #1 day in ms

management:
  endpoints:
    web:
      exposure:
        include:
          health
  endpoint:
    health:
      show-details:
        always
