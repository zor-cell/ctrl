spring:
  application:
    name: ctrl

  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB:test}
    username: ${POSTGRES_USER:your_user}
    password: ${POSTGRES_PASSWORD:your_password}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:init-pgvector.sql

  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect


garage:
  url: http://localhost:3900
  public-url: http://localhost:3900
  access-key: test-access-key
  secret-key: test-secret-key
  bucket-name: ctrl-test-media

infinity:
  url: http://localhost:7997
  model: test-model

application:
  security:
    jwt:
      secret-key: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      expiration: 86400000  # 1 day in ms
    id-austria:
      issuer-uri: "http://localhost:8081/realms/id-austria-mock"
      client-id: "ctrl-test"
      client-secret: "ctrl-test-secret"
      token-uri: "http://localhost:8081/realms/id-austria-mock/protocol/openid-connect/token"
      redirect-uri: "http://localhost:4200/verification-callback"
  auth:
    require-email-verification: true