spring:
  application:
    name: ctrl
  datasource:
    url: jdbc:postgresql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:5433}/${TEST_DB_NAME:${DB_NAME:testdb}}
    username: ${TEST_DB_USERNAME:${DB_USERNAME:testuser}}
    password: ${TEST_DB_PASSWORD:${DB_PASSWORD:testpw}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect



garage:
  url: http://localhost:3900
  public-url: http://localhost:3900
  access-key: test-access-key
  secret-key: test-secret-key
  bucket-name: ctrl-test-media

infinity:
  url: http://localhost:7997
  model: test-model

application:
  security:
    jwt:
      secret-key: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      expiration: 86400000  # 1 day in ms
    id-austria:
      issuer-uri: "http://localhost:8081/realms/id-austria-mock"
      client-id: "ctrl-test"
      client-secret: "ctrl-test-secret"
      token-uri: "http://localhost:8081/realms/id-austria-mock/protocol/openid-connect/token"
      redirect-uri: "http://localhost:4200/verification-callback"
