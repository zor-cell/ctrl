@if (!hide()) {
  @switch (status()) {
    @case ('NOT_FOLLOWING') {
      <p-button label="Follow" size="small" [rounded]="true" [outlined]="true"
                [loading]="busy()" (onClick)="follow()" styleClass="follow-btn"  />
    }
    @case ('PENDING_REQUEST_SENT') {
      <p-button label="Requested" size="small" [rounded]="true"
                severity="secondary" [loading]="busy()" (onClick)="cancelRequest()" styleClass="follow-btn"  />
    }
    @case ('PENDING_REQUEST_INCOMING') {
      <p-button label="Accept" size="small" [rounded]="true"
                severity="info" [loading]="busy()" (onClick)="acceptRequest()" styleClass="follow-btn"  />
    }
    @case ('FOLLOWED') {
      <p-button label="Following" size="small" [rounded]="true"
                severity="secondary" [loading]="busy()" (onClick)="unfollow()" styleClass="follow-btn"  />
    }
    @case ('FRIEND') {
      <p-button label="Friends" size="small" [rounded]="true"
                severity="success" styleClass="follow-btn"
                [loading]="busy()" (onClick)="unfriend()" />
    }
  }
}
