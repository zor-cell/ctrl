<div class="followed-list">
  <p-menu #menu [model]="menuItems" [popup]="true" appendTo="body" />

  @if (followed().length === 0) {
    <div class="empty-state">
      @if (searchQuery()) {
        <p>No users match your search. Try a different search term or clear the search.</p>
      } @else {
        <p>Not following anyone yet. Click "Find People" to start following!</p>
      }
    </div>
  } @else {
    <div class="list-container">
      @for (user of followed(); track user.id) {
        <div class="followed-item">
          <p-avatar
            [image]="user.profilePicture || undefined"
            [label]="user.username.charAt(0)"
            shape="circle"
            styleClass="followed-avatar"
            (click)="navigateToProfile(user.username)" />

          <div class="followed-info">
            <span class="username">&#64;{{ user.username }}</span>
          </div>

          <p-button
            icon="pi pi-ellipsis-v"
            severity="secondary"
            text
            (onClick)="openMenu($event, user.username)" />
        </div>
      }
    </div>
  }
</div>
