<div class="followed-list">
  <p-menu #menu [model]="menuItems" [popup]="true" appendTo="body" />

  @if (followed().length === 0) {
    <div class="empty-state">
      @if (searchQuery()) {
        <p>No users match your search. Try a different search term or clear the search.</p>
      } @else {
        <p>Not following anyone yet. Click "Find People" to start following!</p>
      }
    </div>
  } @else {
    <div class="list-container">
      @for (user of followed(); track user.id) {
        <div class="followed-item">
          <button
            type="button"
            class="profile-avatar"
            (click)="navigateToProfile(user.username)">
            @if (hasProfilePicture(user)) {
              <img
                [src]="profilePictureUrl(user)"
                alt=""
                class="profile-avatar__image"
                (error)="markProfilePictureFailed(user)"
              />
            } @else {
              <span class="profile-avatar__initial">{{ getInitial(user) }}</span>
            }
          </button>

          <div class="followed-info" style="cursor:pointer"
               (click)="navigateToProfile(user.username)"
               (keydown.enter)="navigateToProfile(user.username)"
               (keydown.space)="navigateToProfile(user.username)"
               tabindex="0"
               role="button">
               <span class="username">&#64;{{ user.username }}</span>
          </div>

          <p-button
            icon="pi pi-ellipsis-v"
            severity="secondary"
            text
            (onClick)="openMenu($event, user.username)" />
        </div>
      }
    </div>
  }
</div>
