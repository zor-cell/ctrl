<div class="user-search">
  <!-- Search Input -->
  <div class="search-section">
    <p-iconField iconPosition="left">
      <p-inputIcon styleClass="pi pi-search" />
      <input
        type="text"
        pInputText
        placeholder="Search by username..."
        [ngModel]="searchQuery()"
        (ngModelChange)="onSearchInputChange($event)"
        (keyup.enter)="onSearch()"
        class="search-input" />
      @if (searchQuery()) {
        <button
          type="button"
          class="clear-button"
          (click)="clearSearch()"
          title="Clear search">
          <i class="pi pi-times"></i>
        </button>
      }
    </p-iconField>
    <p-button
      icon="pi pi-search"
      (onClick)="onSearch()"
      label="Search" />
  </div>

  <!-- Filter Toggles -->
  <div class="filter-section">
    <p-button
      [label]="excludeFriends() ? 'Hide Friends' : 'Show Friends'"
      [icon]="excludeFriends() ? 'pi pi-check' : 'pi pi-times'"
      [severity]="excludeFriends() ? 'secondary' : 'primary'"
      (onClick)="toggleFilter('friends')"
      size="small"
      [text]="!excludeFriends()" />

    <p-button
      [label]="excludeFollowed() ? 'Hide Followed' : 'Show Followed'"
      [icon]="excludeFollowed() ? 'pi pi-check' : 'pi pi-times'"
      [severity]="excludeFollowed() ? 'secondary' : 'primary'"
      (onClick)="toggleFilter('followed')"
      size="small"
      [text]="!excludeFollowed()" />

    <p-button
      [label]="verifiedOnly() ? 'Verified Only' : 'All Users'"
      [icon]="verifiedOnly() ? 'pi pi-check-circle' : 'pi pi-circle'"
      [severity]="verifiedOnly() ? 'success' : 'primary'"
      (onClick)="toggleFilter('verified')"
      size="small"
      [text]="!verifiedOnly()" />
  </div>

  <!-- Results -->
  <div class="results-section">
    @if (searchQuery().trim().length < 2) {
      <div class="empty-state">
        <p>Enter at least 2 characters to search</p>
      </div>
    } @else if (searchResults().length === 0) {
      <div class="empty-state">
        <p>No users found matching your search and filters</p>
      </div>
    } @else {
      <div class="results-list">
        @for (user of searchResults(); track user.id) {
          <button
            type="button"
            class="user-item"
            (click)="openUserProfile(user)"
            >
            <span class="user-avatar" aria-hidden="true">
              @if (hasProfilePicture(user)) {
                <img
                  [src]="user.profilePicture"
                  alt=""
                  (error)="markProfilePictureFailed(user)" />
              } @else {
                {{ getInitial(user) }}
              }
            </span>

            <div class="user-info">
              <span class="name">{{ user.name || user.username }}</span>
              <span class="username">&#64;{{ user.username }}</span>
              @if (user.relationshipStatuses.length > 0 || user.isVerified) {
                <div class="relationship-badges">
                  @if (user.isVerified) {
                    <span class="relationship-badge verified">Verified</span>
                  }
                  @for (statusItem of user.relationshipStatuses; track statusItem.status) {
                    @switch (statusItem.status) {
                      @case ('FRIEND') {
                        <span class="relationship-badge friend">Friend</span>
                      }
                      @case ('FOLLOWED') {
                        <span class="relationship-badge followed">Followed</span>
                      }
                      @case ('PENDING_REQUEST_SENT') {
                        <span class="relationship-badge pending-sent">Request Sent</span>
                      }
                      @case ('PENDING_REQUEST_INCOMING') {
                        <span class="relationship-badge pending-incoming">Request Incoming</span>
                      }
                    }
                  }
                </div>
              }
            </div>

            <div class="user-actions">
              @if (canFollow(user)) {
                <p-button
                  icon="pi pi-plus"
                  label="Follow"
                  severity="secondary"
                  (onClick)="followUser(user); $event.stopPropagation()"
                  size="small" />
              }
              @if (hasIncomingRequest(user)) {
                <p-button
                  icon="pi pi-check"
                  label="Accept Request"
                  severity="success"
                  (onClick)="acceptIncomingRequest(user); $event.stopPropagation()"
                  size="small" />
              }
              @if (hasPendingSentRequest(user)) {
                <p-button
                  icon="pi pi-clock"
                  label="Request Sent"
                  severity="secondary"
                  [disabled]="true"
                  size="small" />
              }
              @if (canAddFriend(user)) {
                <p-button
                  icon="pi pi-user-plus"
                  label="Add Friend"
                  (onClick)="sendFriendRequest(user); $event.stopPropagation()"
                  size="small" />
              }
            </div>
          </button>
        }
      </div>
    }
  </div>
</div>
