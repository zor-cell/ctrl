<div class="callback-container">
    <h2>Verifying your Identity...</h2>
    @if (isError()) {
        <p>Something went wrong while verifying your identity.</p>
        <p-button label="Return to Profile" (onClick)="goHome()"></p-button>
    } @else {
        <p-progressSpinner ariaLabel="Loading"></p-progressSpinner>
        <p>Please wait while we verify your identity...</p>
    }
</div>
