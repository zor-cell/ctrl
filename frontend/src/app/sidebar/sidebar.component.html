<div class="shell">

  <header class="topbar">

    <p-tabs [value]="activeRoute()">
      <p-tablist>
        @for (item of items; track item.route) {
          <p-tab
            [value]="item.route"
            [disabled]="item.requiresAuth && !authService.isAuthenticated()"
            (click)="navigate(item)"
          >
            <span>{{ item.icon }}</span>
            <span>{{ item.label }}</span>
          </p-tab>
        }
      </p-tablist>
    </p-tabs>


    <p-button
      [icon]="themeService.isDark() ? 'pi pi-sun' : 'pi pi-moon'"
      (onClick)="themeService.toggle()"
    />

  </header>

  <main class="shell__content">
    <router-outlet />
  </main>

</div>
