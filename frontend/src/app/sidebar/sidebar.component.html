<div class="shell">

  <header class="topbar">

    <nav class="topbar__nav">
      @for (item of devItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="nav-link--active"
          class="nav-link"
          [title]="item.label"
        >
          <span class="nav-link__icon">{{ item.icon }}</span>
          <span class="nav-link__label">{{ item.label }}</span>
        </a>
      }
    </nav>

    <button class="theme-toggle" (click)="themeService.toggle()">
      <span>{{ themeService.theme() === 'dark' ? '☀️' : '🌙' }}</span>
      <span>{{ themeService.theme() === 'dark' ? 'Light' : 'Dark' }}</span>
    </button>

  </header>

  <main class="shell__content">
    <router-outlet />
  </main>

</div>
