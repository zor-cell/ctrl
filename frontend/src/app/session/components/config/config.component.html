<div class="wrapper">
    <div class="form-container">
        @if (isLoading()) {
            <div class="loading-spinner">
                <p-progress-spinner ariaLabel="loading"></p-progress-spinner>
            </div>
        } @else {
            <div class="form-header">
                <h2>Session Limits</h2>
            </div>

            <form [formGroup]="configForm" (ngSubmit)="saveConfig()">
                <div class="slider-field">
                    <div class="slider-header">
                        <div class="slider-label-group">
                            <label for="weightInteraction">Time Limit</label>
                            <i class="pi pi-info-circle hint-icon"
                               pTooltip="The maximum time in minutes you will be able to spend daily on CTRL."
                               tooltipPosition="right"></i>
                        </div>
                        <span class="level-badge">{{ configForm.get('timeLimitMinutes')?.value}} Minute{{(configForm.get('timeLimitMinutes')?.value === 1 ? '' : 's')}}</span>
                    </div>
                    <p-slider
                            id="timeLimit"
                            formControlName="timeLimitMinutes"
                            [min]="1"
                            [max]="180"
                            [style]="{'width': '100%'}">
                    </p-slider>
                </div>

                <div class="slider-field">
                    <div class="slider-header">
                        <div class="slider-label-group">
                            <label for="postLimit">Post Limit</label>
                            <i class="pi pi-info-circle hint-icon"
                               pTooltip="The maximum amount of posts you will be able to see daily on CTRL."
                               tooltipPosition="right"></i>
                        </div>
                        <span class="level-badge">{{ configForm.get('postLimit')?.value}} Minute{{(configForm.get('postLimit')?.value === 1 ? '' : 's')}}</span>
                    </div>
                    <p-slider
                            id="postLimit"
                            formControlName="postLimit"
                            [min]="1"
                            [max]="300"
                            [style]="{'width': '100%'}">
                    </p-slider>
                </div>

                <div class="form-field">
                    <label for="isForcedCutoff">
                        Force cutoff <i class="pi pi-info-circle hint-icon"
                                        pTooltip="Denotes whether you will be forced to exit CTRL after your limit was reached, or your will receive a popup."
                                        tooltipPosition="right"></i>
                    </label>
                    <p-toggle-switch formControlName="isForcedCutoff" inputId="isForcedCutoff">></p-toggle-switch>
                </div>

                <p-button
                        type="submit"
                        [label]="'Save Configuration'"
                        fluid>
                </p-button>

            </form>
        }
    </div>
</div>
