<p-dialog
        header="Session Limit Reached"
        [visible]="sessionState.isLimitReached()"
        [modal]="true"
        [closable]="false"
        [closeOnEscape]="false"
        [style]="{ width: '25rem' }">

    <div class="popup-content">
        <div>
            <i class="pi pi-stopwatch"></i> You have reached your daily limit!
        </div>

        <div>{{ sessionState.limitMessage() }}</div>

        <p-button
                label="I understand"
                (onClick)="sessionState.closeModal()"
                fluid>
        </p-button>

        @if(!sessionConfig()?.isForcedCutoff) {
            <p-button>
                Keep scrolling
            </p-button>
        }
    </div>
</p-dialog>
