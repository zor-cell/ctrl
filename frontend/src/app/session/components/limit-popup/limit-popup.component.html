<p-dialog
        header="Session Limit Reached"
        [visible]="sessionState.isLimitReached()"
        [modal]="true"
        [closable]="false"
        [closeOnEscape]="false"
        [style]="{ width: '25rem' }">

    <div class="popup-content">
        <div><i class="pi pi-stopwatch"></i> {{ sessionState.limitMessage() }}</div>

        <div class="popup-actions">
            <p-button
                    label="I understand"
                    (onClick)="hardCutoff()"
                    [style.width]="sessionConfig()?.isForcedCutoff ? '100%' : 'auto'" fluid>
            </p-button>

            @if(!sessionConfig()?.isForcedCutoff) {
                <p-button
                        label="Keep scrolling"
                        severity="danger"
                        (onClick)="softCutoff()">
                </p-button>
            }
        </div>
    </div>
</p-dialog>
