<div class="wrapper">
  <div class="form-container">
    <div class="form-header">
      <h2>Request Reset Password</h2>
    </div>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="submit()" class="login-form">
      <div>
        <p-floatlabel variant="on">
          <input
            pInputText
            id="email"
            type="email"
            formControlName="email"
          />
          <label for="email">Email Address</label>
        </p-floatlabel>

        @if (forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched) {
          <p-message severity="error" size="small" variant="simple">
            Please enter a valid email address.
          </p-message>
        }
      </div>

      <p-button type="submit" label="Send Reset Link" [loading]="submited" [disabled]="submited"></p-button>
    </form>

  </div>
</div>
