<div [class.has-profile-pic]="!!profilePictureUrl()" [class.is-admin]="authService.isAdmin()">
  <p-menubar [model]="navItems()" class="nav-bar">
    <ng-template pTemplate="start">
      @if (authService.isAuthenticated()) {
        <div class="logo-text" routerLink="/feed" style="cursor: pointer">CTRL</div>
      } @else {
        <div class="logo-text">CTRL</div>
      }
    </ng-template>

    <ng-template pTemplate="end">
      @if (!authService.isAuthenticated()) {
        <div class="auth-buttons">
          <p-button label="Login" size="small" [text]="true" routerLink="/login"/>
          <p-button label="Register" size="small" routerLink="/register"/>
        </div>
      }
      <p-button
        [icon]="themeService.isDark() ? 'pi pi-sun' : 'pi pi-moon'"
        [rounded]="true"
        [text]="true"
        (onClick)="themeService.toggle()"
      />
    </ng-template>
  </p-menubar>
</div>
