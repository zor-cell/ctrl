<div>
    <p-menubar [model]="navItems()" class="nav-bar">
        <ng-template pTemplate="start">
            <div class="logo-text">CTRL</div>
        </ng-template>

        <ng-template pTemplate="end">
            <div class="profile-container">
                @if (authService.isAuthenticated()) {
                    <p-avatar
                            icon="pi pi-user"
                            shape="circle"
                            class="cursor-pointer"
                            (click)="profileMenu.toggle($event)"
                    />

                    <p-menu #profileMenu [model]="profileItems()" [popup]="true" />
                } @else {
                    <p-button label="Login" size="small" [text]="true" routerLink="/login" />
                    <p-button label="Register" size="small" routerLink="/register" />
                }

                <p-button
                        [icon]="themeService.isDark() ? 'pi pi-sun' : 'pi pi-moon'"
                        [rounded]="true"
                        [text]="true"
                        (onClick)="themeService.toggle()"
                />
            </div>
        </ng-template>

    </p-menubar>
</div>
