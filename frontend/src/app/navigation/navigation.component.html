<div [class.has-profile-pic]="!!profilePictureUrl()"
     [style]="profilePictureUrl() ? 'url(' + profilePictureUrl() + ')' : null">
  <p-menubar [model]="navItems()" class="nav-bar">
    <ng-template pTemplate="start">
      <div class="logo-text">CTRL</div>
    </ng-template>

    <ng-template pTemplate="end">
      @if (!authService.isAuthenticated()) {
        <div class="auth-buttons">
          <p-button label="Login" size="small" [text]="true" routerLink="/login"/>
          <p-button label="Register" size="small" routerLink="/register"/>
        </div>
      }
      <p-button
        [icon]="themeService.isDark() ? 'pi pi-sun' : 'pi pi-moon'"
        [rounded]="true"
        [text]="true"
        (onClick)="themeService.toggle()"
      />
    </ng-template>
  </p-menubar>
</div>
