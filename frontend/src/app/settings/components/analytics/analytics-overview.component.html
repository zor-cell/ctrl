<div class="analytics-tabs">
  <p-tabs [value]="activeTab()">
    <p-tablist>
      <p-tab (click)="tabChange.emit('lastWeek')" value="lastWeek">Last Week</p-tab>
      <p-tab (click)="tabChange.emit('average')" value="average">60-Day Average</p-tab>
    </p-tablist>

    <p-tabpanels>
      <p-tabpanel value="lastWeek">
        <div class="chart-wrapper">
          @if (isLoadingLastWeek()) {
            <div class="skeleton-chart">
              <p-skeleton width="100%" height="2rem" styleClass="mb-3" />
              <div class="skeleton-bars">
                @for (i of [0,1,2,3,4,5,6]; track i) {
                  <p-skeleton width="12%" height="12rem" />
                }
              </div>
            </div>
          } @else {
            <p-chart
              type="bar"
              [data]="lastWeekChartData()"
              [options]="lastWeekChartOptions()"
              height="300px"
            />
          }
        </div>
      </p-tabpanel>

      <p-tabpanel value="average">
        <div class="chart-wrapper">
          @if (isLoadingAverage()) {
            <div class="skeleton-chart">
              <p-skeleton width="100%" height="2rem" styleClass="mb-3" />
              <div class="skeleton-bars">
                @for (i of [0,1,2,3,4,5,6]; track i) {
                  <p-skeleton width="12%" height="12rem" />
                }
              </div>
            </div>
          } @else {
            <p-chart
              type="bar"
              [data]="averageChartData()"
              [options]="averageChartOptions()"
              height="300px"
            />
          }
        </div>
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
</div>
