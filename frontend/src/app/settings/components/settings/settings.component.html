<div class="wrapper">
  <p-tabs lazy [value]="activeTab()" (valueChange)="onTabChange($event)">
    <p-tablist>
      <p-tab value="account">
          Account
      </p-tab>
      <p-tab value="session">
          Session
      </p-tab>
      <p-tab value="algorithm">
          Algorithm
      </p-tab>
      <p-tab value="analytics">
          Analytics
      </p-tab>
    </p-tablist>

    <p-tabpanels>
        <p-tabpanel value="account">
            <ng-template #content>
                <app-profile></app-profile>
            </ng-template>
        </p-tabpanel>
        <p-tabpanel value="session">
            <ng-template #content>
                <app-session-config></app-session-config>
            </ng-template>
        </p-tabpanel>
        <p-tabpanel value="algorithm">
            <ng-template #content>
                <app-algorithm-config></app-algorithm-config>
            </ng-template>
        </p-tabpanel>
        <p-tabpanel value="analytics">
            <ng-template #content>
                <app-analytics></app-analytics>
            </ng-template>
        </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
</div>
