apiVersion: apps/v1
kind: Deployment
metadata:
  name: verification
  namespace: ctrl
  labels:
    app: ctrl
    component: verification
spec:
  replicas: 1
  selector:
    matchLabels:
      component: verification
  template:
    metadata:
      labels:
        app: ctrl
        component: verification
    spec:
      containers:
        - name: verification
          image: quay.io/keycloak/keycloak:24.0
          args:
            - start
            - --import-realm
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "1000Mi"
              cpu: "300m"
            limits:
              memory: "1500Mi"
              cpu: "750m"
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: ctrl-secrets
                  key: keycloak-admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ctrl-secrets
                  key: keycloak-admin-password
            - name: ID_AUSTRIA_SECRET
              valueFrom:
                secretKeyRef:
                  name: ctrl-secrets
                  key: id-austria-secret
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: ctrl-config
                  key: db-name
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: ctrl-config
                  key: db-host
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: ctrl-config
                  key: db-port
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_SCHEMA
              value: "keycloak"
            - name: KC_DB_URL
              value: "jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ctrl-secrets
                  key: db-username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ctrl-secrets
                  key: db-password
            - name: KC_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: ctrl-config
                  key: kc-hostname
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "false"
            - name: KC_HTTP_RELATIVE_PATH
              value: "/"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_MANAGEMENT_CLIENT_AUTH
              value: "none"
            - name: KC_PROXY
              value: "edge"
            - name: KC_HTTP_ENABLED
              value: "true"
          volumeMounts:
            - name: verification-import
              mountPath: /opt/keycloak/data/import
            - name: verification-data
              mountPath: /opt/keycloak/data
            - name: verification-theme
              mountPath: /opt/keycloak/themes/id-austria
      volumes:
        - name: verification-import
          configMap:
            name: verification-import
        - name: verification-data
          persistentVolumeClaim:
            claimName: verification-data-pvc
        - name: verification-theme
          persistentVolumeClaim:
            claimName: verification-theme-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: verification-service
  namespace: ctrl
  labels:
    app: ctrl
    component: verification
spec:
  selector:
    component: verification
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verification-data-pvc
  namespace: ctrl
  labels:
    app: ctrl
    component: verification
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verification-theme-pvc
  namespace: ctrl
  labels:
    app: ctrl
    component: verification
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: verification-theme
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: verification-theme
  namespace: ctrl
  labels:
    app: ctrl
    component: verification
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: verification-theme
  local:
    path: /opt/ctrl/setup/keycloak/theme
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ctrl-ubuntu-8gb

