apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: ctrl
  labels:
    app: ctrl
    component: db
spec:
  replicas: 1
  selector:
    matchLabels:
      component: db
  template:
    metadata:
      labels:
        app: ctrl
        component: db
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg18-trixie
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: ctrl-config
                  key: db-name
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ctrl-secrets
                  key: db-username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ctrl-secrets
                  key: db-password
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: postgres-init
          configMap:
            name: postgres-init
        - name: db-data
          persistentVolumeClaim:
            claimName: db-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: db-service
  namespace: ctrl
  labels:
    app: ctrl
    component: db
spec:
  selector:
    component: db
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-pvc
  namespace: ctrl
  labels:
    app: ctrl
    component: db
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: ctrl
  labels:
    app: ctrl
    component: db
data:
  init.sql: |
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE SCHEMA IF NOT EXISTS keycloak;

    --Function to compute the wilson score
    --https://insightful-data-lab.com/2025/08/20/wilson-score-interval/
    CREATE OR REPLACE FUNCTION wilson_score(upvotes integer, downvotes integer)
        RETURNS numeric AS $$
    DECLARE
        n integer;
        p numeric;
        z numeric := 1.96;     -- z-score for 95% confidence
        z2 numeric := 3.8416;  -- z^2
    BEGIN
        n := COALESCE(upvotes, 0) + COALESCE(downvotes, 0);

        IF n = 0 THEN
            RETURN 0.0;
        END IF;

        p := COALESCE(upvotes, 0)::numeric / n;

        RETURN (
            (p + z2 / (2 * n) - z * SQRT((p * (1 - p)) / n + z2 / (4 * n * n)))
                / (1 + z2 / n)
            );
    END;
    $$ LANGUAGE plpgsql IMMUTABLE;
