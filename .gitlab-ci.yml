---
stages:
  - lint
  - test
  - build

.temp: &temp
  rules:
    - when: manual
      allow_failure: true

lint:backend:
  stage: lint
  image: registry.reset.inso-w.at/pub/docker/debian-mvn
  cache:
    key: ${CI_JOB_NAME}-m2-${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository
  script:
    - java -version
    - mvn --version
    - mvn spotless:check -f ./backend/
  artifacts:
    expire_in: 1h
    when: on_failure

lint:frontend:
  stage: lint
  image: registry.reset.inso-w.at/pub/docker/node:22-alpine
  cache:
    key: ${CI_JOB_NAME}-npm-${CI_COMMIT_REF_SLUG}
    paths:
      - .npm
  script:
    - cd frontend && npm ci && npm run lint
  artifacts:
    expire_in: 1h
    when: on_failure


test:backend:
  stage: test
  image: registry.reset.inso-w.at/pub/docker/debian-mvn
  cache:
    key: ${CI_JOB_NAME}-m2-${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository
  services:
    - name: $CI_REGISTRY_IMAGE/test-db:pg18-ci
      alias: db
      variables:
        HEALTHCHECK_TCP_PORT: "5432"
        POSTGRES_DB: testdb
        POSTGRES_USER: test
        POSTGRES_PASSWORD: test
  variables:
    CI_DEBUG_SERVICES: "true"
    POSTGRES_DB: testdb
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/testdb
  script:
    - mvn test -f ./backend
  artifacts:
    expire_in: 1h
    reports:
      junit: ./backend/target/surefire-reports/TEST-*.xml
    when: on_failure

test:frontend:
  stage: test
  image: registry.reset.inso-w.at/pub/docker/node:22-alpine
  cache:
    key: ${CI_JOB_NAME}-npm-${CI_COMMIT_REF_SLUG}
    paths:
      - .npm
  script:
    - cd frontend && npm ci && npm run test
  artifacts:
    expire_in: 1h
    reports:
      junit: ./frontend/test-results/*.xml
    when: on_failure

.build_rules: &build_rules
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG


build:backend:
  stage: build
  image: registry.reset.inso-w.at/pub/docker/debian-mvn
  cache:
    key: 
      files:
        - backend/pom.xml
      prefix: ${CI_JOB_NAME}
    paths:
      - .m2/repository
  script:
    - mvn clean package -DskipTests -f ./backend/
  artifacts:
    expire_in: 1 day
    paths:
      - ./backend/target/
  <<: *build_rules

build:frontend:
  stage: build
  image: registry.reset.inso-w.at/pub/docker/node:22-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
      prefix: ${CI_JOB_NAME}
    paths:
      - .npm
  script:
    - cd frontend && npm ci && npm run build
  artifacts:
    expire_in: 1 day
    paths:
      - ./frontend/dist/
  <<: *build_rules

build:image:
  stage: build
  image: registry.reset.inso-w.at/pub/docker/debian-mvn
  needs:
    - job: build:frontend
      artifacts: true
    - job: build:backend
      artifacts: true
  script:
    - mvn jib:build
        -Djib.from.image=registry.reset.inso-w.at/pub/docker/eclipse-temurin:25
        -Djib.to.image=${CI_REGISTRY_IMAGE}:${CI_PIPELINE_ID}
        -Djib.to.auth.username=${CI_REGISTRY_USER}
        -Djib.to.auth.password=${CI_REGISTRY_PASSWORD}
  <<: *build_rules
