---
stages:
  - lint
  - test
  - build

.temp: &temp
  rules:
    - when: manual
      allow_failure: true

lint:backend:
  stage: lint
  image: registry.reset.inso-w.at/pub/docker/debian-mvn
  cache:
    key: ${CI_JOB_NAME}-m2-${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository
  script:
    - java -version
    - mvn --version
    - mvn spotless:check -f ./backend/
  artifacts:
    expire_in: 1h
    when: on_failure

lint:frontend:
  stage: lint
  image: registry.reset.inso-w.at/pub/docker/node:22-alpine
  cache:
    key: ${CI_JOB_NAME}-npm-${CI_COMMIT_REF_SLUG}
    paths:
      - .npm
  script:
    - cd frontend && npm ci && npm run lint
  artifacts:
    expire_in: 1h
    when: on_failure


test:backend:
  stage: test
  image: registry.reset.inso-w.at/pub/docker/debian-mvn
  needs:
    - job: lint:backend
      optional: false
    - job: lint:frontend
      optional: true
  cache:
    key: ${CI_JOB_NAME}-m2-${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository
  services:
    - name: $CI_REGISTRY_IMAGE/test-db:pg18-ci
      alias: db
      variables:
        HEALTHCHECK_TCP_PORT: "5432"
        POSTGRES_DB: testdb
        POSTGRES_USER: test
        POSTGRES_PASSWORD: test
  variables:
    CI_DEBUG_SERVICES: "true"
    POSTGRES_DB: testdb
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/testdb
  script:
    - mvn test -f ./backend
  artifacts:
    expire_in: 1h
    reports:
      junit: ./backend/target/surefire-reports/TEST-*.xml
    when: on_failure
  allow_failure: true
  
test:e2e:
  stage: test
  image: registry.reset.inso-w.at/pub/docker/cypress:latest
  needs:
    - job: lint:backend
      optional: false
    - job: lint:frontend
      optional: true
  cache:
      key: ${CI_JOB_NAME}-npm-${CI_COMMIT_REF_SLUG}
      paths:
      - .npm
      - node_modules
  services:
    - name: $CI_REGISTRY_IMAGE/test-db:pg18-ci
      alias: db
      variables:
        HEALTHCHECK_TCP_PORT: "5432"
        POSTGRES_DB: testdb
        POSTGRES_USER: test
        POSTGRES_PASSWORD: test
  variables:
    CI_DEBUG_SERVICES: "true"
    POSTGRES_DB: testdb
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/testdb
  script:
      - cd frontend && npm ci && npm run cypress:ci
  artifacts:
      expire_in: 7h
      paths:
        - frontend/e2e-test-results/
        - frontend/cypress/screenshots/
        - frontend/cypress/videos/
      reports:
        junit: ./frontend/e2e-test-results/*.xml
      when: always
  allow_failure: true

.build_rules: &build_rules
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG


build:backend:
  stage: build
  image: registry.reset.inso-w.at/pub/docker/debian-mvn
  cache:
    key: 
      files:
        - backend/pom.xml
      prefix: ${CI_JOB_NAME}
    paths:
      - .m2/repository
  script:
    - mvn clean package -DskipTests -f ./backend/ -Dmaven.repo.local=${CI_PROJECT_DIR}/.m2/repository
  artifacts:
    expire_in: 1 day
    paths:
      - ./backend/target/
  <<: *build_rules

build:frontend:
  stage: build
  image: registry.reset.inso-w.at/pub/docker/node:22-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
      prefix: ${CI_JOB_NAME}
    paths:
      - .npm
  script:
    - cd frontend && npm ci --cache ../.npm && npm run build
  artifacts:
    expire_in: 1 day
    paths:
      - ./frontend/dist/
  <<: *build_rules

build:image:
  stage: build
  image: registry.reset.inso-w.at/pub/docker/debian-mvn
  cache:
    key:
      files:
        - backend/pom.xml
      prefix: ${CI_JOB_NAME}
    paths:
      - .m2/repository
  needs:
    - job: build:frontend
      artifacts: true
    - job: build:backend
      artifacts: true
  script:
    - mvn jib:build -f ./backend/
        -Djib.to.image=${CI_REGISTRY_IMAGE}:${CI_PIPELINE_ID}
        -Djib.to.tags=latest
        -Djib.to.auth.username=${CI_REGISTRY_USER}
        -Djib.to.auth.password=${CI_REGISTRY_PASSWORD}
        -Dmaven.repo.local=${CI_PROJECT_DIR}/.m2/repository
  <<: *build_rules
