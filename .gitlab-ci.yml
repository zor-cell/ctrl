---
stages:
  - lint
  - test
  - build

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

.temp: &temp
  rules:
    - when: manual
      allow_failure: true

lint:backend:
  stage: lint
  image: registry.reset.inso-w.at/pub/docker/debian-mvn
  cache:
    key: ${CI_JOB_NAME}-m2-${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository
  script:
    - java -version
    - mvn --version
    - mvn spotless:check -f ./backend/
  artifacts:
    expire_in: 1h
    when: on_failure
  <<: *temp

lint:frontend:
  stage: lint
  image: registry.reset.inso-w.at/pub/docker/node:22-alpine
  cache:
    key: ${CI_JOB_NAME}-npm-${CI_COMMIT_REF_SLUG}
    paths:
      - .npm
  script:
    - cd frontend && npm ci && npm run lint
  artifacts:
    expire_in: 1h
    when: on_failure
  <<: *temp

test:backend:
  stage: test
  image: registry.reset.inso-w.at/pub/docker/debian-mvn
  cache:
    key: ${CI_JOB_NAME}-m2-${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository
  services:
    - name: registry.reset.inso-w.at/pub/docker/pgvector:pg18-trixie
      alias: db
      variables:
        HEALTHCHECK_TCP_PORT: "5432"
        POSTGRES_DB: testdb
        POSTGRES_USER: test
        POSTGRES_PASSWORD: test
  variables:
    CI_DEBUG_SERVICES: "true"
    POSTGRES_DB: testdb
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    TEST_DB_HOST: db
    TEST_DB_PORT: "5432"
    TEST_DB_NAME: testdb
    TEST_DB_USERNAME: test
    TEST_DB_PASSWORD: test
  script:
    - mvn test -f ./backend
  artifacts:
    expire_in: 1h
    reports:
      junit: ./backend/target/surefire-reports/TEST-*.xml
    when: on_failure
  <<: *temp

test:frontend:
  stage: test
  image: registry.reset.inso-w.at/pub/docker/node:22-alpine
  cache:
    key: ${CI_JOB_NAME}-npm-${CI_COMMIT_REF_SLUG}
    paths:
      - .npm
  script:
    - cd frontend && npm ci && npm run test
  artifacts:
    expire_in: 1h
    reports:
      junit: ./frontend/test-results/*.xml
    when: on_failure
  <<: *temp

.build_rules: &build_rules
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG


build:backend:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  cache:
    key: ${CI_JOB_NAME}-m2-${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository
  script:
    - mvn clean package -DskipTests -f ./backend/
  artifacts:
    expire_in: 7 days
    paths:
      - ./backend/target/
  <<: *build_rules

build:frontend:
  stage: build
  image: node:20
  cache:
    key: ${CI_JOB_NAME}-npm-${CI_COMMIT_REF_SLUG}
    paths:
      - .npm
  script:
    - cd frontend && npm ci && npm run build
  artifacts:
    paths:
      - ./frontend/dist/
  <<: *build_rules

.docker_base:
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

build:docker-backend:
  extends: .docker_base
  stage: build
  needs:
    - job: build:backend
      artifacts: true
  script:
    - docker build --cache-from "$CI_REGISTRY_IMAGE/backend:latest" -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE/backend:latest" ./backend
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/backend:latest"
  <<: *build_rules

build:docker-frontend:
  extends: .docker_base
  stage: build
  needs:
    - job: build:frontend
      artifacts: true
  script:
    - docker build --cache-from "$CI_REGISTRY_IMAGE/frontend:latest" -t "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE/frontend:latest" ./frontend
    - docker push "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/frontend:latest"
  <<: *build_rules
