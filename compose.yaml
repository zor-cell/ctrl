name: ctrl

services:
  backend:
    platform: linux/amd64
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - MINIO_USER=${MINIO_USER}
      - MINIO_PASSWORD=${MINIO_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
        restart: false
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
        restart: false
    restart: on-failure:3

  db:
    platform: linux/amd64
    image: pgvector/pgvector:pg18-trixie
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - db_data:/var/lib/postgresql
      - ./setup/init.sql:/docker-entrypoint-initdb.d/init.sql # start setup

  minio:
    platform: linux/amd64
    image: minio/minio:latest
    ports:
      - "9000:9000" # api
      - "9001:9001" # admin web ui
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    # create a minio bucket for media files with public permissions on startup
    entrypoint: >
      /bin/sh -c "
      minio server /data --console-address ':9001' & 
      sleep 3;
      mc alias set local http://localhost:9000 ${MINIO_USER} ${MINIO_PASSWORD};
      mc mb local/ctrl-dev-media --ignore-existing;
      mc anonymous set download local/ctrl-dev-media;
      wait
      "
    restart: on-failure:3

  infinity:
    platform: linux/amd64
    image: michaelf34/infinity:latest-cpu
    ports:
      - "7997:7997"
    environment:
      - INFINITY_MODEL_ID=${INFINITY_MODEL}
      - INFINITY_BATCH_SIZE=32
      - INFINITY_ENGINE=torch
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7997/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - infinity_cache:/app/.cache

volumes:
  db_data:
  minio_data:
  infinity_cache:
