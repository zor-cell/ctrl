name: ctrl

services:
  backend:
    build: ./backend
    secrets:
      - db_username
      - db_password
    depends_on:
      db:
        condition: service_healthy
        restart: false
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
        restart: false
    restart: on-failure:3

  db:
    image: pgvector/pgvector:pg18-trixie
    secrets:
      - db_username
      - db_password
    environment:
      POSTGRES_DB: ctrl_db
      POSTGRES_USER_FILE: /run/secrets/db_username
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $(cat /run/secrets/db_username) -d ctrl_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

secrets:
    db_username:
        file: ./db_username.txt
    db_password:
        file: ./db_password.txt
