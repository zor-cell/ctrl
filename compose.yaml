name: ctrl

services:
  backend:
    platform: linux/amd64
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - GARAGE_ACCESS_KEY=${GARAGE_ACCESS_KEY}
      - GARAGE_SECRET_KEY=${GARAGE_SECRET_KEY}
      - INFINITY_MODEL=${INFINITY_MODEL}
    depends_on:
      db:
        condition: service_healthy
        restart: false
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
        restart: false
    restart: on-failure:3

  db:
    platform: linux/amd64
    image: pgvector/pgvector:pg18-trixie
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - db_data:/var/lib/postgresql
      - ./setup/init.sql:/docker-entrypoint-initdb.d/init.sql # start setup

  garage:
    platform: linux/amd64
    image: dxflrs/garage:v2.2.0
    ports:
      - "3900:3900" # S3 api
      - "3902:3902" # S3 web gui
      - "3903:3903" # admin api
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ctrl-dev-media
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
      - ./setup/garage.toml:/etc/garage.toml
    command: /garage server

  infinity:
    platform: linux/amd64
    image: michaelf34/infinity:latest-cpu
    ports:
      - "7997:7997"
    environment:
      - INFINITY_MODEL_ID=${INFINITY_MODEL}
      - INFINITY_BATCH_SIZE=32
      - INFINITY_ENGINE=torch
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7997/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - infinity_cache:/app/.cache

volumes:
  db_data:
  garage_meta:
  garage_data:
  infinity_cache:
