name: ctrl

services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
    secrets:
      - db_username
      - db_password
    depends_on:
      db:
        condition: service_healthy
        restart: false
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
        restart: false
    restart: on-failure:3

  db:
    image: pgvector/pgvector:pg18-trixie
    ports:
      - "127.0.0.1:5433:5432"
    secrets:
      - db_username
      - db_password
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER_FILE: /run/secrets/db_username
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $(cat /run/secrets/db_username) -d ctrl_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - db_data:/var/lib/postgresql

volumes:
  db_data:

secrets:
    db_username:
        environment: "DB_USERNAME"
    db_password:
        environment: "DB_PASSWORD"
