name: ctrl

services:
  backend:
    platform: linux/amd64
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - ID_AUSTRIA_SECRET=${ID_AUSTRIA_SECRET}
    depends_on:
      db:
        condition: service_healthy
        restart: false
      keycloak:
        condition: service_healthy
        restart: false
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
        restart: false
    restart: on-failure:3

  db:
    platform: linux/amd64
    image: pgvector/pgvector:pg18-trixie
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - db_data:/var/lib/postgresql

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_PASSWORD}
      - ID_AUSTRIA_SECRET=${ID_AUSTRIA_SECRET}
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HTTP_RELATIVE_PATH=/
      - KC_HEALTH_ENABLED=true
    ports:
      - "8081:8080"
    healthcheck:
      # curl is not installed in image, so raw tcp connection check for healthchecks
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep 'HTTP/1.1 200 OK' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./backend/keycloak-config:/opt/keycloak/data/import/ # import test dataset

  infinity:
    platform: linux/amd64
    image: michaelfeil/infinity:latest-cpu
    ports:
      - "7997:7997"
    environment:
      - INFINITY_MODEL_ID=jinaai/jina-clip-v1
      - INFINITY_BATCH_SIZE=32
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7997/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - infinity_cache:/app/.cache

volumes:
  db_data:
  keycloak_data:
